name: Build debug APK

# Собирает .apk при каждом пуше в main и по кнопке "Run workflow" вручную.
# В репозитории нет закоммиченного gradle-wrapper (gradlew/gradlew.bat) —
# Android Studio генерирует его сама при первом открытии проекта, поэтому
# здесь ставим Gradle явно через setup-gradle и вызываем `gradle` напрямую,
# а не `./gradlew`. Если позже добавите wrapper в репозиторий — замените
# `gradle assembleDebug` на `./gradlew assembleDebug` для консистентности
# с локальной сборкой.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Write local.properties (sdk.dir only — секреты НЕ коммитим)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Restore signing keystore (стабильная подпись)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/ci.keystore"
            echo "VA_KEYSTORE_FILE=$GITHUB_WORKSPACE/ci.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан случайным debug-ключом (обновление поверх и Google-вход работать не будут). См. README."
          fi

      - name: Download Vosk model (иначе в APK нет модели речи и STT не заработает)
        run: sh scripts/download_vosk_model.sh

      - name: Assemble debug APK
        env:
          VA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Unit tests (required)
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voiceagent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
