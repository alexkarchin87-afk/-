services:
  worker:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AGENT_WORKER_TOKEN=${AGENT_WORKER_TOKEN:?set AGENT_WORKER_TOKEN in your .env}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-}
      - DEEPSEEK_VISION_MODEL=${DEEPSEEK_VISION_MODEL:-}
    restart: unless-stopped
