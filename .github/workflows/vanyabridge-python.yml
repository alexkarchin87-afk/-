name: VanyaBridge Python regression checks
on:
  pull_request:
    paths:
      - 'VanyaBridge/**'
      - '.github/workflows/vanyabridge-python.yml'
  push:
    branches: [feature/vanyabridge-specialized-chats]
    paths:
      - 'VanyaBridge/**'
      - '.github/workflows/vanyabridge-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VanyaBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: python -m compileall -q backend desktop tests desktop_entry.py
      - name: Tests
        run: python -m pytest -q
