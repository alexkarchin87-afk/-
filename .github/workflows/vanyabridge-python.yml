name: VanyaBridge Python regression checks
on:
  pull_request:
    paths:
      - 'VanyaBridge/**'
      - '.github/workflows/vanyabridge-python.yml'
  push:
    branches: [feature/vanyabridge-specialized-chats]
    paths:
      - 'VanyaBridge/**'
      - '.github/workflows/vanyabridge-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VanyaBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax
        run: python -m compileall -q backend desktop tests desktop_entry.py
      - name: Tests
        run: python -m pytest -q

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 and build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build and test Android app
        working-directory: VanyaBridge/android
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest
