name: VanyaBridge Python regression checks

on:
  pull_request:
    paths:
      - 'VanyaBridge/backend/**'
      - 'VanyaBridge/desktop/**'
      - 'VanyaBridge/desktop_entry.py'
      - 'VanyaBridge/tests/**'
      - 'VanyaBridge/requirements*.txt'
      - '.github/workflows/vanyabridge-python.yml'
  push:
    paths:
      - 'VanyaBridge/backend/**'
      - 'VanyaBridge/desktop/**'
      - 'VanyaBridge/desktop_entry.py'
      - 'VanyaBridge/tests/**'
      - 'VanyaBridge/requirements*.txt'
      - '.github/workflows/vanyabridge-python.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vanyabridge-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.12 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: VanyaBridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            VanyaBridge/requirements.txt
            VanyaBridge/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q backend desktop tests desktop_entry.py

      - name: Run regression tests
        run: python -m pytest -q
